_format_version: "3.0"
services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-route
        paths: [/api/v1/auth]
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: redis
  - name: user-service
    url: http://user-service:3002
    routes:
      - name: users-route
        paths: [/api/v1/users]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: redis
  - name: data-service
    url: http://data-service:8001
    routes:
      - name: data-route
        paths: [/api/v1/data]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: redis

