groups:
  - name: neuralmesh.rules
    rules:
      - alert: HighErrorRate
        expr: rate(api_gateway_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} error rate above 5%"

      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(api_gateway_http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Gateway P99 latency above 2 seconds"

      - alert: ServiceHealthLow
        expr: health_monitor_service_health_score < 75
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Health score below 75"

