global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3001"]
  - job_name: user-service
    static_configs:
      - targets: ["user-service:3002"]
  - job_name: data-service
    static_configs:
      - targets: ["data-service:8001"]
  - job_name: worker-service
    static_configs:
      - targets: ["worker-service:8002"]
  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8003"]
  - job_name: metrics-aggregator
    static_configs:
      - targets: ["metrics-aggregator:8004"]
  - job_name: healing-orchestrator
    static_configs:
      - targets: ["healing-orchestrator:8005"]
  - job_name: chaos-service
    static_configs:
      - targets: ["chaos-service:8006"]
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:3003"]
  - job_name: health-monitor
    static_configs:
      - targets: ["health-monitor:8090"]

