apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuralmesh-data-service-policy
  labels:
    {{- include "neuralmesh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: data-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: worker-service
        - podSelector:
            matchLabels:
              app: metrics-aggregator
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
        - podSelector:
            matchLabels:
              app: kafka

